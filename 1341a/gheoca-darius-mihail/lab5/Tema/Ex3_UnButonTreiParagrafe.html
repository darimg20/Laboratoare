<!DOCTYPE html>
<html>
<head>
<title>Modificari paragrafe</title>
<script>
    function apasaButon() {
        document.getElementById("p1").innerText = "Acesta este paragraful 1";
        document.getElementById("p2").innerText = "Acesta este paragraful 2";
        document.getElementById("p3").innerText = "Acesta este paragraful 3";
        document.getElementById("p1").style.color = "white";
        document.getElementById("p1").style.backgroundColor = "darkblue";
        document.getElementById("p2").style.color = "red";
        document.getElementById("p2").style.backgroundColor = "darkgreen";
        document.getElementById("p3").style.color = "white";
        document.getElementById("p3").style.backgroundColor = "black";
    }
</script>

</head>
<body>

<h1>Modificari paragrafe la click pe buton</h1>

<p id="p1">Acesta este un paragraf</p>

<p id="p2">Si acesta este un paragraf</p>

<p id="p3">Acesta este inca un paragraf</p>

<button type="button" onclick=apasaButon()>Apasa-ma!</button>

</body>
</html>
