<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
    body {
        background-color: #ffffcc;
    }
    #hd {
        font-variant: small-caps;
        color: magenta;
    }
    h1 {
        color: blue;
        background-color: #cccc00;
    }
    .center, p {
        text-align: center;
        color: red;
    }

    /* Formatare tabel conform cerințelor Exercițiului 6 */
    table {
        border-collapse: collapse;
        border: 2px solid green;
    }

    /* Titlu (caption) alb, mare, pe fond portocaliu */
    caption {
        color: white;
        font-size: 1.6em;
        font-weight: bold;
        background-color: orange;
        padding: 8px;
    }

    /* Chenare verzi, contopite și spațiu generos în celule */
    th, td {
        border: 2px solid green;
        padding: 12px 10px;
    }

    /* Antet pe fond magenta */
    th {
        background-color: magenta;
    }

    /* Celule portocalii */
    td {
        background-color: orange;
    }

    /* Celulele cu numele echipelor (Munte, Mare): magenta, îngroșate și centrate */
    td[rowspan] {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%" class="centre">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
    <td rowspan="3">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Calinescu</td>
    <td>fotbal</td>
    <td>jiu-jitsu</td>
  </tr>
  <tr>
    <td rowspan="4">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Albescu</td>
    <td>handbal</td>
    <td>echitatie</td>
  </tr>
</table>
</body>
</html>
