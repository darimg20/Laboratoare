<!DOCTYPE html>
<html>
<head>
<title> Bec </title>

<script>
    let count = 0
    function cresteCounter() {
        count++;
        document.getElementById("numar").innerText = count;
    }
    function aprindeLumina() {
        document.getElementById("bec").src = "Bec aprins.gif"
        document.getElementById("h1").innerText = "Bec aprins"
    }
    function stingeLumina(){
        document.getElementById("bec").src = "Bec stins.gif"
        document.getElementById("h1").innerText = "Bec stins"
    }
</script>

</head>
<body>

<h1 id="h1">Bec stins</h1>



<p>
<img  src="Bec stins.gif" width="100" height="180" id="bec" onclick=cresteCounter() onmouseover=aprindeLumina() onmouseout=stingeLumina()>
</p>
<p>Acest bec a fost apasat de <span id="numar">0</span> ori.</p>




</body>
</html>
