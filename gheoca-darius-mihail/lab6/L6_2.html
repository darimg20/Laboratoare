<!DOCTYPE html>
<html>
<head>
  <title>Acest titlu va fi modificat cu JS</title>
</head>
<body>

  <p>Salutare, <br /> oameni buni! <br /> (De modificat culoarea de background cu js!)</p>

  <p>Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate, <br /> precum si titlul paginii !</p>

  <p>Acest text va fi colorat <br/>folosind <br /> JavaScript</p>

  <script>
    document.title = "Titlu Nou Modificat cu JS";

    const body = document.getElementsByTagName('body')[0];
    body.style.backgroundColor = "#e8f4f8";
    const paragrafe = document.getElementsByTagName('p');

    paragrafe[0].style.color = "darkgreen";
    paragrafe[1].style.color = "darkblue";
    paragrafe[2].style.color = "crimson";
    paragrafe[2].style.fontWeight = "bold";
  </script>

</body>
</html>
